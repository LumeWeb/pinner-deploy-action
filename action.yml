name: 'Pinner Deploy Action'
description: 'Deploy content to IPFS via Pinner'
inputs:
  api-key:
    description: 'Pinner API key'
    required: true
  path:
    description: 'Local directory or file to upload to IPFS'
    required: false
  cid:
    description: 'Existing CID to pin (skip upload)'
    required: false
  endpoint:
    description: 'Pinner API endpoint'
    required: false
    default: 'https://ipfs.pinner.xyz'
  ipns-key:
    description: 'IPNS key name or ID to publish under'
    required: false
  domain:
    description: 'Domain for gateway website setup'
    required: false
  remove-previous:
    description: 'Remove previous pin after successful deploy'
    required: false
    default: 'false'
outputs:
  cid:
    description: 'CID of the uploaded/pinned content'
  gateway-url:
    description: 'Gateway URL for the content'
  ipns-name:
    description: 'IPNS name if published'
  website-id:
    description: 'Website ID if domain was configured'
runs:
  using: 'node20'
  main: 'dist/index.js'
